<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker Home Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/sb.css">
</head>
<body class="board">
<div class="board-head">
  <h1>2 · Worker home</h1>
  <p>Availability and profile completeness first, then direct requests (respond) kept separate from open jobs (apply), the active contract, and stats only where backed by data. Sample content for layout only.</p>
</div>

<template id="screen">
  <div class="statusbar"><span>9:41</span><span class="icons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>
  <div class="scroll">
    <div class="appbar">
      <div class="grow"><div class="t-caption">Assalam-o-Alaikum</div><div class="t-title-lg">Imran</div></div>
      <button class="icon-btn" aria-label="Notifications, 3 unread"><span class="ms">notifications</span><span class="dot-badge">3</span></button>
    </div>

    <div class="pad stack" style="margin-top:4px">
      <div class="card p">
        <div class="row">
          <div class="grow">
            <div class="t-title-sm">You're available</div>
            <div class="t-body muted">Clients nearby can find and message you.</div>
          </div>
          <div class="switch" role="switch" aria-checked="true" aria-label="Available for work"></div>
        </div>
        <div class="divider" style="margin:14px 0"></div>
        <div class="row" style="margin-bottom:8px"><div class="grow t-label">Profile 80% complete</div><span class="t-label" style="color:var(--primary)">Finish</span></div>
        <div class="progress"><i style="width:80%"></i></div>
        <div class="t-caption" style="margin-top:8px">Add 2 work photos — profiles with photos get more requests.</div>
      </div>
    </div>

    <div class="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">
      <div class="card" style="padding:12px"><div class="t-caption">Rating</div><div class="t-title num" style="display:flex;align-items:center;gap:2px">4.8<span class="ms fill s16 star">star</span></div><div class="t-caption">37 reviews</div></div>
      <div class="card" style="padding:12px"><div class="t-caption">Completed</div><div class="t-title num">41</div><div class="t-caption">contracts</div></div>
      <div class="card" style="padding:12px"><div class="t-caption">This month</div><div class="t-title num">Rs 18.5k</div><div class="t-caption">agreed value</div></div>
    </div>

    <div class="section-h"><div class="grow"><div class="t-title">Direct requests</div><div class="t-caption">Clients asked for you — respond within 24 h</div></div><span class="badge tone-info">2 new</span></div>
    <div class="pad">
      <div class="card p">
        <div class="row top">
          <div class="avatar sm amber">SA</div>
          <div class="grow">
            <div class="row" style="gap:6px"><span class="t-title-sm grow ellipsis">Sana Ahmed</span><span class="t-caption">12 min ago</span></div>
            <div class="t-body">Two switchboards sparking in kitchen</div>
            <div class="meta" style="margin-top:6px"><span><span class="ms s14">place</span>G-11/2 · ≈ 1.5 km</span><span><span class="ms s14">event</span>Today, after 5 PM</span></div>
          </div>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="sb-btn secondary compact grow">Decline</button>
          <button class="sb-btn primary compact grow">View &amp; respond</button>
        </div>
      </div>
    </div>

    <div class="section-h"><div class="grow t-title">Active contract</div></div>
    <div class="pad">
      <div class="card p">
        <div class="row">
          <div class="cat-tile cat-amber"><span class="ms s20">ac_unit</span></div>
          <div class="grow"><div class="t-title-sm">AC service — 2 split units</div><div class="t-caption">Bilal Khan · F-7/3</div></div>
          <span class="badge tone-info"><span class="ms">sync</span>In progress</span>
        </div>
        <div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <div class="grow"><div class="t-label num">Today · 4:00 PM</div><div class="t-caption">Rs 4,500 agreed · payment not collected in app</div></div>
          <button class="icon-btn" style="width:44px;height:44px;box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:8px;color:var(--primary)" aria-label="Open chat"><span class="ms s20">chat</span></button>
        </div>
      </div>
    </div>

    <div class="section-h"><div class="grow t-title">Jobs matching your skills</div><button class="sb-btn quiet compact">See all</button></div>
    <div class="pad stack">
      <div class="card sb-job">
        <div class="row top">
          <div class="cat-tile cat-ink"><span class="ms s20">bolt</span></div>
          <div class="grow"><div class="t-label-sm muted">Electrician</div><div class="t-title-sm">Full house wiring check before move-in</div></div>
        </div>
        <div class="metas"><span><span class="ms s16">place</span>G-10 · ≈ 3 km</span><span><span class="ms s16">schedule</span>1 h ago</span></div>
        <div class="foot"><span class="grow t-label num">Rs 6,000 – 9,000 · fixed</span><span class="t-caption">4 proposals</span></div>
      </div>
    </div>
    <div style="height:16px"></div>
  </div>
  <nav class="navbar">
    <div class="dest on"><div class="pill"><span class="ms fill">home</span></div>Home</div>
    <div class="dest"><div class="pill"><span class="ms">description</span></div>Proposals</div>
    <div class="dest"><div class="pill"><span class="ms">handshake</span></div>Contracts</div>
    <div class="dest"><div class="pill"><span class="ms">chat_bubble</span><span class="nb">1</span></div>Chats</div>
    <div class="dest"><div class="pill"><span class="ms">person</span></div>Profile</div>
  </nav>
</template>

<div class="frames" id="frames"></div>
<script src="assets/frames.js"></script>
<script>
  renderFrames([
    { tpl: 'screen', theme: 'light', label: 'Light · full scroll', height: 1310 },
    { tpl: 'screen', theme: 'dark', label: 'Dark · full scroll', height: 1310 },
  ]);
</script>
</body>
</html>
