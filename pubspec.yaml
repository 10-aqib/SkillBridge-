name: skill_bridge
description: "Skill Bridge - Local Skills Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # ── Navigation ──
  go_router: ^17.3.0

  # ── Serialization ──
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── UI & Design ──
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_rating_bar: ^4.0.1

  # ── Local Storage ──
  hive_flutter: ^1.1.0

  # ── Utilities ──
  intl: ^0.20.2
  connectivity_plus: ^7.3.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  share_plus: ^10.1.4

  # ── Firebase ──
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  firebase_app_check: ^0.4.5+2
  flutter_local_notifications: ^18.0.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
